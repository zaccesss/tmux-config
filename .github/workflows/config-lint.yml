name: Config Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Start a session with the config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tmux
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y tmux

      - name: Session smoke test
        run: |
          tmux -f tmux.conf new-session -d -s ci
          tmux -f tmux.conf list-sessions
          tmux kill-session -t ci
